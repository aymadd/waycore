name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pipx
        run: python -m pip install --user pipx && python -m pipx ensurepath

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Lint (ruff)
        run: poetry run ruff check device/

      - name: Format check (black)
        run: poetry run black --check device/

      - name: Type check (mypy)
        run: poetry run mypy device/ --strict

      - name: Run tests with coverage
        run: poetry run pytest --cov=device --cov-report=term-missing --cov-fail-under=90
