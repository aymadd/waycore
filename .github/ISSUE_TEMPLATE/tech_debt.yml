name: "Tech debt / Refactor"
description: "Propose a refactor, cleanup, or improvement"
labels: ["tech-debt"]
title: "[debt] "
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What code/area is affected and why?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What refactor/cleanup do you propose?
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risks and mitigations
  - type: checkboxes
    id: benefits
    attributes:
      label: Expected benefits
      options:
        - label: Improves readability/maintainability
        - label: Reduces complexity/duplication
        - label: Improves performance
        - label: Improves reliability
