name: "Bug report"
description: "Report a bug or regression"
labels: ["bug"]
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Waycore. Please fill out the details below.
  - type: checkboxes
    attributes:
      label: Pre-checks
      options:
        - label: I searched existing issues and discussions
          required: true
        - label: I can reproduce this on the latest main branch (if applicable)
          required: false
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened? What did you expect to happen?
      placeholder: A clear and concise description
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs/output
      description: Paste error logs, stack traces, or screenshots
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment details
      description: OS, Python/Node versions, Docker versions, hardware notes, etc.
      placeholder: "e.g., macOS 15, Python 3.11, Node 20, Docker 27"
