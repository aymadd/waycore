# MCP Server Configuration for AI Service
#
# This file defines the MCP (Model Context Protocol) servers that the AI service
# will connect to for tool access. Each server runs as a subprocess and
# communicates via stdio.
#
# Transport: All servers use stdio (subprocess) transport for zero-latency
# local communication.

servers:
  # Sensor data access server
  sensors:
    command: "python"
    args: ["-m", "device.services.ai_service.mcp_servers.sensors"]
    description: "Device sensor data access (temperature, GPS, compass, etc.)"
    enabled: true
    timeout_seconds: 5  # Sensors should respond quickly

  # Device actions server
  actions:
    command: "python"
    args: ["-m", "device.services.ai_service.mcp_servers.actions"]
    description: "Device actions (notes, mesh messages, settings)"
    enabled: true
    timeout_seconds: 10
    # Tools that require user confirmation before execution
    requires_confirmation:
      - send_mesh_message
      - factory_reset
      - delete_note
      - clear_conversation

  # RAG Documentation server
  rag_docs:
    command: "python"
    args: ["-m", "device.services.ai_service.mcp_servers.rag_docs.server"]
    description: "Waycore documentation search"
    enabled: true
    timeout_seconds: 30

  # Outdoor Knowledge RAG server
  outdoor_knowledge:
    command: "python"
    args: ["-m", "device.services.ai_service.mcp_servers.outdoor_knowledge.server"]
    description: "Outdoor survival knowledge (plants, first aid, navigation, knots)"
    enabled: true
    timeout_seconds: 30

# Default settings applied to all servers unless overridden
defaults:
  timeout_seconds: 10
  enabled: true
