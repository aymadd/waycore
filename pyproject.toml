[tool.poetry]
name = "waycore"
version = "0.1.0"
description = "Waycore device software stack"
authors = ["Waycore Contributors"]
readme = "README.md"
packages = [{ include = "device" }]

[tool.poetry.scripts]
waycore-ui = "device.apps.ui.main:main"

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.7"
fastapi = "^0.115"
uvicorn = {version = "^0.30", extras = ["standard"]}
aiosqlite = "^0.20"
paho-mqtt = "^2.1"
httpx = "^0.27"
PyYAML = "^6.0"
typing-extensions = "^4.12"
requests-unixsocket = "^0.3.0"
PySide6 = { version = "^6.10.1", markers = "python_version >= '3.11' and python_version < '3.15'" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
pytest-mock = "^3.14"
hypothesis = "^6.111"
ruff = "^0.8.2"
black = "^24.10.0"
mypy = "^1.13.0"
types-PyYAML = "^6.0.12"
pre-commit = "^3.8.0"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["device"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
src = ["device"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
exclude = "^(progress/|scripts/|device/.*/tests/|device/drivers/|device/.+/__init__\\.py$)"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
