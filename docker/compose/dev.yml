services:
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: waycore-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ../..:/workspace:ro
      - ../mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 1883"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: "no"
    networks:
      - waycore-dev
  core-daemon:
    build:
      context: ../..
      dockerfile: device/services/core_daemon/Dockerfile
    container_name: waycore-core-daemon
    environment:
      - CORE_DAEMON_CONFIG=/app/device/services/core_daemon/config/default.yaml
      - USE_UNIX_SOCKET=false  # Use HTTP for local dev (UI runs outside Docker)
    ports:
      - "8000:8000"
    depends_on:
      - mqtt
    networks:
      - waycore-dev
    volumes:
      - waycore-sockets:/tmp/waycore
  module-manager:
    build:
      context: ../..
      dockerfile: device/services/module_manager/Dockerfile
    container_name: waycore-module-manager
    environment:
      - MODULE_MANAGER_CONFIG=/app/device/services/module_manager/config/default.yaml
    ports:
      - "8001:8001"
    depends_on:
      - mqtt
    networks:
      - waycore-dev
    volumes:
      - waycore-sockets:/tmp/waycore
  comms-bridge:
    build:
      context: ../..
      dockerfile: device/services/comms_bridge/Dockerfile
    container_name: waycore-comms-bridge
    environment:
      - COMMS_BRIDGE_CONFIG=/app/device/services/comms_bridge/config/default.yaml
      - USE_UNIX_SOCKET=false  # Use HTTP for local dev (UI runs outside Docker)
    ports:
      - "8003:8003"
    depends_on:
      - mqtt
    networks:
      - waycore-dev
    volumes:
      - waycore-sockets:/tmp/waycore
      - waycore-data:/app/data  # Mesh database files
  data-logger:
    build:
      context: ../..
      dockerfile: device/services/data_logger/Dockerfile
    container_name: waycore-data-logger
    environment:
      - DATA_LOGGER_CONFIG=/app/device/services/data_logger/config/default.yaml
      - USE_UNIX_SOCKET=false  # Use HTTP for local dev (UI runs outside Docker)
    volumes:
      - ../..:/workspace:ro
      - waycore-sockets:/tmp/waycore
      - waycore-data:/app/data  # Database files accessible via named volume
    ports:
      - "8002:8002"
    depends_on:
      - mqtt
    networks:
      - waycore-dev
  ai-service:
    build:
      context: ../..
      dockerfile: device/services/ai_service/Dockerfile
    container_name: waycore-ai-service
    environment:
      - AI_SERVICE_CONFIG=/app/device/services/ai_service/config/default.yaml
    ports:
      - "8010:8010"
    depends_on:
      - mqtt
    networks:
      - waycore-dev
    volumes:
      - waycore-sockets:/tmp/waycore

  camera-service:
    build:
      context: ../..
      dockerfile: device/services/camera_service/Dockerfile
    container_name: waycore-camera-service
    environment:
      - CAMERA_SERVICE_CONFIG=/app/device/services/camera_service/config/default.yaml
      - USE_UNIX_SOCKET=false  # Use HTTP for local dev (UI runs outside Docker)
    ports:
      - "8006:8006"
    depends_on:
      - mqtt
    networks:
      - waycore-dev
    volumes:
      - waycore-sockets:/tmp/waycore
      - waycore-photos:/app/data/photos

  # Web-based SQLite database viewer (shows all domain databases)
  db-viewer:
    image: datasetteproject/datasette:latest
    container_name: waycore-db-viewer
    command: >
      datasette
      /data/general.sqlite3
      /data/mesh.sqlite3
      /data/ai.sqlite3
      --host 0.0.0.0
      --port 8080
      --setting sql_time_limit_ms 5000
      --setting max_returned_rows 1000
    ports:
      - "8080:8080"
    volumes:
      - waycore-data:/data
    depends_on:
      - data-logger
      - comms-bridge
    networks:
      - waycore-dev
    restart: "no"

networks:
  waycore-dev:
    driver: bridge
volumes:
  waycore-sockets:
  waycore-data:
  waycore-photos:
